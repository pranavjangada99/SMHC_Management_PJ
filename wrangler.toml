name = "homoeocare-clinic"
main = "worker/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "homoeocare-clinic-d1"
database_id = "341574ae-78d0-4369-aae5-0765ffdcb1cc"
migrations_dir = "migrations"

# Environment variables
[vars]
FIREBASE_PROJECT_ID = "sacred-question-mv4kj"
CLINIC_NAME = "HomoeoCare Health Centre"

# Cloudflare Pages build output configuration
# Build command: npm run build
# Build output directory: dist
